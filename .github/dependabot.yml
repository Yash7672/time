version: 2
updates:
  # Keep Gradle dependencies current (security patches for AndroidX, Coroutines…).
  - package-ecosystem: gradle
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Keep the SHA-pinned GitHub Actions in workflows up to date.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
