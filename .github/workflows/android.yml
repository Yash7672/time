name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; only the release job gets write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint & build
    runs-on: ubuntu-latest

    steps:
      # All actions are pinned to a full commit SHA (supply-chain hardening);
      # the trailing comment records the upstream tag for Dependabot.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false
          validate-wrappers: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # `bash gradlew` works regardless of the file mode, and gradlew is also
      # committed as 100755 + locked to LF by .gitattributes (exit 126 fix).
      - name: Run unit tests
        run: bash gradlew :app:testDebugUnitTest --stacktrace

      - name: Run lint
        run: bash gradlew :app:lintDebug --stacktrace

      # Release signing comes from secrets when configured; otherwise the build
      # file falls back to the debug key so an installable artifact always exists.
      - name: Build release APK and AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
              > keystore.properties
            echo "Release keystore configured from secrets."
          else
            echo "No KEYSTORE_BASE64 secret - building debug-signed release artifact."
          fi
          bash gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Build debug APK
        run: bash gradlew :app:assembleDebug --stacktrace

      - name: Collect reports
        if: always()
        run: |
          mkdir -p ci-reports
          if [ -d app/build/reports ]; then cp -r app/build/reports ci-reports/reports; fi
          if [ -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
            cp app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ci-reports/lint-results.txt
          fi

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: ci-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chronos-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload release AAB (Play Store bundle)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chronos-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chronos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chronos-release-apk
          path: apk

      - name: Download AAB
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chronos-release-aab
          path: aab

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(ls apk/*.apk | head -n 1)
          AAB=$(ls aab/*.aab | head -n 1)
          VERSION="${GITHUB_REF_NAME}"
          NOTES="CHRONOS ${VERSION} - AMOLED space clock. See README for install steps, the privacy policy and known Android limitations."
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$APK" "$AAB" --clobber
          else
            gh release create "$VERSION" "$APK" "$AAB" --title "$VERSION" --notes "$NOTES"
          fi
