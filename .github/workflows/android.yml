name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # --- Unit tests (23 tests: TimeUtils, NotificationReducer, StarField) ---
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # --- Lint (abortOnError = true in the build file) ---
      - name: Run lint
        run: ./gradlew :app:lintDebug --stacktrace

      # --- Release APK (falls back to debug signing when no keystore) ---
      - name: Build release APK
        env:
          # Optional signing secrets — never committed. When absent the build
          # produces a debug-signed but fully installable APK.
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Release keystore configured from secrets."
          else
            echo "No KEYSTORE_BASE64 secret — building debug-signed release APK."
          fi
          ./gradlew :app:assembleRelease --stacktrace

      - name: Collect test report
        if: always()
        run: |
          mkdir -p ci-reports
          cp -r app/build/reports/tests ci-reports/tests 2>/dev/null || true
          cp app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ci-reports/lint-results.txt 2>/dev/null || true

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: ci-reports/
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: chronos-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chronos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: chronos-release-apk
          path: apk

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(ls apk/*.apk | head -n 1)
          VERSION="${GITHUB_REF_NAME}"
          NOTES="CHRONOS ${VERSION} — AMOLED space clock. See README for install steps and known Android limitations."
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$APK" --clobber
          else
            gh release create "$VERSION" "$APK" --title "$VERSION" --notes "$NOTES"
          fi
